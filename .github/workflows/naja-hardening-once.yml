name: Apply Naja Dashboard Hardening

on:
  push:
    branches:
      - feature/naja-btc-price
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naja-hardening-once
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Harden HTTPS freshness and Wi-Fi polling
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected patch anchor not found in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "main/btc_price.h",
              "    int64_t updated_at_us;\n    bool valid;",
              "    int64_t updated_at_us;\n    int64_t change_updated_at_us;\n    bool valid;",
          )

          replace_once(
              "main/btc_price.c",
              "#include <stddef.h>\n#include <string.h>",
              "#include <stddef.h>\n#include <string.h>\n#include <time.h>",
          )
          replace_once(
              "main/btc_price.c",
              '#include "esp_http_client.h"\n#include "esp_log.h"',
              '#include "esp_http_client.h"\n#include "esp_log.h"\n#include "esp_netif_sntp.h"',
          )
          replace_once(
              "main/btc_price.c",
              "#define BTC_PRICE_STALE_US          (15LL * 60LL * 1000000LL)\n#define BTC_PRICE_HTTP_TIMEOUT_MS   10000",
              "#define BTC_PRICE_STALE_US          (15LL * 60LL * 1000000LL)\n#define BTC_PRICE_CHANGE_STALE_US   (15LL * 60LL * 1000000LL)\n#define BTC_PRICE_HTTP_TIMEOUT_MS   10000\n#define BTC_PRICE_TIME_SYNC_MS      20000\n#define BTC_PRICE_VALID_EPOCH       1704067200LL",
          )
          replace_once(
              "main/btc_price.c",
              "static SemaphoreHandle_t price_mutex;\nstatic TaskHandle_t price_task_handle;\nstatic btc_price_snapshot_t cached_price;\n\nstatic esp_err_t http_event_handler",
              "static SemaphoreHandle_t price_mutex;\nstatic TaskHandle_t price_task_handle;\nstatic btc_price_snapshot_t cached_price;\nstatic bool sntp_initialized;\n\nstatic bool wall_clock_is_valid(void)\n{\n    time_t now = 0;\n    time(&now);\n    return (int64_t)now >= BTC_PRICE_VALID_EPOCH;\n}\n\nstatic bool ensure_wall_clock_synced(void)\n{\n    if (wall_clock_is_valid()) {\n        return true;\n    }\n\n    if (!sntp_initialized) {\n        esp_sntp_config_t config = ESP_NETIF_SNTP_DEFAULT_CONFIG(\"pool.ntp.org\");\n        esp_err_t err = esp_netif_sntp_init(&config);\n        if (err != ESP_OK && err != ESP_ERR_INVALID_STATE) {\n            ESP_LOGW(TAG, \"Unable to start SNTP: %s\", esp_err_to_name(err));\n            return false;\n        }\n        sntp_initialized = true;\n    }\n\n    const TickType_t poll_delay = pdMS_TO_TICKS(500);\n    const TickType_t timeout = pdMS_TO_TICKS(BTC_PRICE_TIME_SYNC_MS);\n    TickType_t waited = 0;\n    while (waited < timeout) {\n        if (wall_clock_is_valid()) {\n            return true;\n        }\n        vTaskDelay(poll_delay);\n        waited += poll_delay;\n    }\n\n    ESP_LOGW(TAG, \"System clock is not synchronized; deferring HTTPS price request\");\n    return false;\n}\n\nstatic esp_err_t http_event_handler",
          )
          replace_once(
              "main/btc_price.c",
              "    cached_price.change_24h = change_24h;\n    cached_price.updated_at_us = esp_timer_get_time();",
              "    cached_price.change_24h = change_24h;\n    cached_price.updated_at_us = esp_timer_get_time();\n    cached_price.change_updated_at_us = cached_price.updated_at_us;",
          )
          replace_once(
              "main/btc_price.c",
              "        bool refreshed = refresh_from_coingecko();",
              "        if (!ensure_wall_clock_synced()) {\n            vTaskDelay(pdMS_TO_TICKS(BTC_PRICE_RETRY_MS));\n            continue;\n        }\n\n        bool refreshed = refresh_from_coingecko();",
          )
          replace_once(
              "main/btc_price.c",
              "    if (out_snapshot->valid) {\n        int64_t age_us = esp_timer_get_time() - out_snapshot->updated_at_us;\n        out_snapshot->stale = age_us > BTC_PRICE_STALE_US;\n    }",
              "    if (out_snapshot->valid) {\n        int64_t now_us = esp_timer_get_time();\n        int64_t age_us = now_us - out_snapshot->updated_at_us;\n        out_snapshot->stale = age_us > BTC_PRICE_STALE_US;\n\n        if (out_snapshot->change_valid &&\n            (out_snapshot->change_updated_at_us <= 0 ||\n             now_us - out_snapshot->change_updated_at_us > BTC_PRICE_CHANGE_STALE_US)) {\n            out_snapshot->change_valid = false;\n        }\n    }",
          )

          replace_once(
              "main/naja_dashboard.c",
              "#define NAJA_UPDATE_MS 500\n#define NAJA_PAGE_DURATION_MS 10000",
              "#define NAJA_UPDATE_MS 500\n#define NAJA_WIFI_REFRESH_MS 5000\n#define NAJA_PAGE_DURATION_MS 10000",
          )
          replace_once(
              "main/naja_dashboard.c",
              "static uint32_t current_page_time_ms;\nstatic int8_t current_rssi = -128;",
              "static uint32_t current_page_time_ms;\nstatic uint32_t wifi_refresh_elapsed_ms = NAJA_WIFI_REFRESH_MS;\nstatic int8_t current_rssi = -128;",
          )
          replace_once(
              "main/naja_dashboard.c",
              "    int8_t rssi = -128;\n    if (module->is_connected && get_wifi_current_rssi(&rssi) == ESP_OK) {\n        current_rssi = rssi;\n    } else {\n        current_rssi = -128;\n    }",
              "    if (wifi_refresh_elapsed_ms >= NAJA_WIFI_REFRESH_MS) {\n        int8_t rssi = -128;\n        if (module->is_connected && get_wifi_current_rssi(&rssi) == ESP_OK) {\n            current_rssi = rssi;\n        } else {\n            current_rssi = -128;\n        }\n        wifi_refresh_elapsed_ms = 0;\n    }\n    wifi_refresh_elapsed_ms += NAJA_UPDATE_MS;",
          )
          replace_once(
              "main/naja_dashboard.c",
              "    char compact_diff[24];\n    format_compact_number((double)state->pool_difficulty, compact_diff, sizeof(compact_diff));\n    lv_label_set_text(ui.mining_pool_diff, compact_diff);",
              "    char compact_diff[24];\n    if (state->pool_difficulty > 0) {\n        format_compact_number((double)state->pool_difficulty, compact_diff, sizeof(compact_diff));\n        lv_label_set_text(ui.mining_pool_diff, compact_diff);\n    } else {\n        lv_label_set_text(ui.mining_pool_diff, \"--\");\n    }",
          )
          replace_once(
              "main/naja_dashboard.c",
              "    if (!visible) {\n        current_page_time_ms = 0;\n        return;\n    }",
              "    if (!visible) {\n        current_page_time_ms = 0;\n        wifi_refresh_elapsed_ms = NAJA_WIFI_REFRESH_MS;\n        return;\n    }",
          )

          verify = Path(".github/workflows/naja-verify.yml")
          verify_text = verify.read_text(encoding="utf-8")
          verify_text = verify_text.replace(
              "          grep -q 'CONFIG_MBEDTLS_DEFAULT_CERTIFICATE_BUNDLE=y' sdkconfig.defaults\n",
              "          grep -q 'CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL=y' sdkconfig.defaults\n"
              "          grep -q 'esp_netif_sntp_init' main/btc_price.c\n",
          )
          verify_text = verify_text.replace(
              "          git diff --check\n",
              "          git diff --check origin/master...HEAD\n",
          )
          verify.write_text(verify_text, encoding="utf-8")

      - name: Enable the ESP-IDF certificate bundle
        shell: bash
        run: |
          set -euo pipefail
          printf '\n' >> sdkconfig.defaults
          grep -qxF 'CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y' sdkconfig.defaults || echo 'CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y' >> sdkconfig.defaults
          grep -qxF 'CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL=y' sdkconfig.defaults || echo 'CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL=y' >> sdkconfig.defaults

      - name: Remove this one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/naja-hardening-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(naja): harden HTTPS and dashboard refresh behavior'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
