name: Verify Naja BTC Dashboard

on:
  push:
    branches:
      - feature/naja-btc-price
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naja-btc-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Static feature and privacy checks
        id: static
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -s main/btc_price.c
          test -s main/btc_price.h
          test -s main/naja_dashboard.c
          test -s main/naja_dashboard.h
          test -s main/screen_wrap.c
          test -s doc/naja-btc-price.md

          grep -q 'api.coingecko.com/api/v3/simple/price' main/btc_price.c
          grep -q 'mempool.space/api/v1/prices' main/btc_price.c
          grep -q 'NAJA_BOARD_VERSION "1201"' main/naja_dashboard.c
          grep -q 'module->ssid' main/naja_dashboard.c
          grep -q 'module->ip_addr_str' main/naja_dashboard.c
          grep -q 'get_wifi_current_rssi' main/naja_dashboard.c
          grep -q 'btc_price.c' main/CMakeLists.txt
          grep -q -- '--wrap=screen_start' main/CMakeLists.txt
          grep -q 'esp_http_client' main/CMakeLists.txt
          grep -q 'CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y' sdkconfig.defaults
          grep -q 'CONFIG_MBEDTLS_DEFAULT_CERTIFICATE_BUNDLE=y' sdkconfig.defaults

          if grep -En '(^|[^0-9])((10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})|(192\.168\.[0-9]{1,3}\.[0-9]{1,3})|(172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}))([^0-9]|$)' \
              main/btc_price.c main/btc_price.h main/naja_dashboard.c main/naja_dashboard.h main/screen_wrap.c doc/naja-btc-price.md; then
            echo 'A private IPv4 literal was found in feature source.' >&2
            exit 1
          fi

          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.14.0'

      - name: Build AxeOS web UI
        id: web
        continue-on-error: true
        working-directory: ./main/http_server/axe-os
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Build ESP32-S3 firmware with ESP-IDF 6.0.2
        id: firmware
        continue-on-error: true
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          command: bash -lc 'set -o pipefail; GITHUB_ACTIONS=true idf.py build 2>&1 | tee naja-build.log'
          path: '.'

      - name: Create merged firmware image
        id: merged
        if: steps.firmware.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: ./merge_bin.sh ./esp-miner-merged.bin

      - name: Upload verified firmware artifacts
        if: steps.static.outcome == 'success' && steps.web.outcome == 'success' && steps.firmware.outcome == 'success' && steps.merged.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: naja-btc-dashboard-firmware
          path: |
            ./build/esp-miner.bin
            ./esp-miner-merged.bin

      - name: Record verification result and remove temporary connection tests
        if: always()
        shell: bash
        env:
          STATIC_OUTCOME: ${{ steps.static.outcome }}
          WEB_OUTCOME: ${{ steps.web.outcome }}
          FIRMWARE_OUTCOME: ${{ steps.firmware.outcome }}
          MERGED_OUTCOME: ${{ steps.merged.outcome }}
        run: |
          set -euo pipefail
          rm -f doc/connection-test*.txt
          rm -f doc/naja-build-success.md doc/naja-build-failure.md

          if [[ "$STATIC_OUTCOME" == success && "$WEB_OUTCOME" == success && "$FIRMWARE_OUTCOME" == success && "$MERGED_OUTCOME" == success ]]; then
            firmware_sha='unavailable'
            merged_sha='unavailable'
            [[ -f build/esp-miner.bin ]] && firmware_sha=$(sha256sum build/esp-miner.bin | awk '{print $1}')
            [[ -f esp-miner-merged.bin ]] && merged_sha=$(sha256sum esp-miner-merged.bin | awk '{print $1}')

            cat > doc/naja-build-success.md <<EOF
          # Naja BTC dashboard verification

          Status: **PASS**

          Tested source commit: \`${GITHUB_SHA}\`
          Workflow run: \`${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\`

          - Static feature/privacy checks: ${STATIC_OUTCOME}
          - AxeOS production build: ${WEB_OUTCOME}
          - ESP-IDF 6.0.2 ESP32-S3 build: ${FIRMWARE_OUTCOME}
          - Merged firmware image: ${MERGED_OUTCOME}
          - \`esp-miner.bin\` SHA-256: \`${firmware_sha}\`
          - \`esp-miner-merged.bin\` SHA-256: \`${merged_sha}\`

          This verifies source integration and reproducible compilation. Physical LCD orientation, live API reachability, and on-device thermal behavior still require a controlled Naja Duo hardware test before general release.
          EOF
          else
            cat > doc/naja-build-failure.md <<EOF
          # Naja BTC dashboard verification

          Status: **FAIL**

          Tested source commit: \`${GITHUB_SHA}\`
          Workflow run: \`${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\`

          - Static feature/privacy checks: ${STATIC_OUTCOME}
          - AxeOS production build: ${WEB_OUTCOME}
          - ESP-IDF 6.0.2 ESP32-S3 build: ${FIRMWARE_OUTCOME}
          - Merged firmware image: ${MERGED_OUTCOME}

          ## Firmware log tail

          \`\`\`text
          EOF
            if [[ -f naja-build.log ]]; then
              tail -n 200 naja-build.log >> doc/naja-build-failure.md
            else
              echo 'No firmware log file was produced.' >> doc/naja-build-failure.md
            fi
            echo '\`\`\`' >> doc/naja-build-failure.md
          fi

          rm -f naja-build.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A doc
          if ! git diff --cached --quiet; then
            git commit -m 'chore(naja): record CI verification [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Fail workflow when verification did not pass
        if: always() && (steps.static.outcome != 'success' || steps.web.outcome != 'success' || steps.firmware.outcome != 'success' || steps.merged.outcome != 'success')
        shell: bash
        run: exit 1
