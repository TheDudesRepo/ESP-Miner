name: Publish Naja Verification Marker

on:
  push:
    branches:
      - feature/naja-btc-price
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naja-result-marker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish a machine-readable result directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci/naja-pass .ci/naja-fail .ci/naja-pending

          if [[ -f doc/naja-build-success.md ]]; then
            mkdir -p .ci/naja-pass
            cp test/sdkconfig.defaults .ci/naja-pass/marker
          elif [[ -f doc/naja-build-failure.md ]]; then
            mkdir -p .ci/naja-fail
            cp sdkconfig.ci .ci/naja-fail/marker
          else
            mkdir -p .ci/naja-pending
            cp test-ci/sdkconfig.defaults .ci/naja-pending/marker
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .ci
          if ! git diff --cached --quiet; then
            git commit -m 'chore(naja): publish verification marker [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
